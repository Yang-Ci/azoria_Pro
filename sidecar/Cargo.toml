[package]
name = "azoria-ddc-sidecar"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
hidapi = "2.6.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
ddc-hi = { version = "0.4.1", default-features = false, features = ["ddc-macos"] }

[target.'cfg(target_os = "windows")'.dependencies]
base64 = "0.22.1"
ddc-hi = { version = "0.4.1", default-features = false, features = ["ddc-winapi"] }
wmi = { version = "0.18.4", default-features = false }
windows = { version = "0.62.2", features = ["Foundation", "Media", "Media_Control", "Storage_Streams", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility"] }

[target.'cfg(target_os = "linux")'.dependencies]
ddc-hi = { version = "0.4.1", default-features = false, features = ["ddc-i2c"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
